apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: byparr-clients-only
spec:
  podSelector:
    matchLabels:
      app: byparr
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik
        # Prowlarr's saved solver URL uses this Service directly within media.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app: prowlarr
      ports:
        - protocol: TCP
          port: 8191
