apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: garajamus
  namespace: garajamus
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`garajamus.milanchis.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: zion-garajamus
          port: 80
  # Use the ingress controller's existing wildcard certificate.
  tls:
    store:
      name: default
