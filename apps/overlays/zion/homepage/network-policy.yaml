apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage-ingress-only
spec:
  podSelector:
    matchLabels:
      app: homepage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik
      ports:
        - protocol: TCP
          port: 3000
