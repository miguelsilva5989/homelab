apiVersion: apps/v1
kind: Deployment
metadata:  
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      # Use the LAN ingress for OIDC; public DNS passes through Cloudflare.
      hostAliases:
        - ip: 10.69.99.69
          hostnames: [authentik.milanchis.com]
      volumes:
        - name: oidc
          secret:
            secretName: zion-gitlab-oidc
      containers:
        - name: gitlab
          env:
            - name: GITLAB_ROOT_EMAIL
              value: miguelsilva5989@gmail.com
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zion-gitlab-credentials
                  key: rootPassword
