apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab
  namespace: gitlab
  annotations:
    kubernetes.io/ingress.class: gitlab-lan
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`gitlab.milanchis.com`)
      kind: Rule
      services:
        - name: zion-gitlab
          port: 80
      middlewares:
        - name: zion-gitlab-lan-only
  tls:
    secretName: gitlab-certificate-secret
