apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gitlab-lan-only
  namespace: gitlab
spec:
  ipAllowList:
    # Use the actual socket peer. Do not trust client-supplied forwarded headers.
    sourceRange:
      - 10.69.10.0/24
      - 10.69.174.49/32
      # Future private VPN: add its confirmed CIDR here and to the ingress values.
