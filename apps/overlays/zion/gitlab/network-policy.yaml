apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitlab-ingress-only
  namespace: gitlab
spec:
  podSelector:
    matchLabels:
      app: gitlab
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab-ingress
          podSelector:
            matchLabels:
              homelab.milanchis.com/role: gitlab-ingress
      ports:
        - protocol: TCP
          port: 80
