apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  labels:
    app: immich
spec:
  replicas: 1
  # Persistent application state must have a single writer during upgrades.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      containers:
      - name: immich
        image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
        ports:
          - containerPort: 2283
        envFrom:
          - configMapRef:
              name: immich-configmap        
      
      - name: immich-machine-learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
        ports:
          - containerPort: 3003
        envFrom:
          - configMapRef:
              name: immich-configmap        
      
      - name: redis
        image: docker.io/valkey/valkey:9-bookworm@sha256:930b41430fb727f533c5982fe509b6f04233e26d0f7354e04de4b0d5c706e44e
        ports:
        - containerPort: 6379
      
      - name: postgres
        image: registry.milanchis.com/immich-postgres:14.24-vchord0.4.3-20261028-4eef06f3@sha256:4eef06f313181e9ce5812224f6b5c888bf381f071e2a0aafdb5ae563bf433f07
        ports:
        - containerPort: 5432
        envFrom:
          - configMapRef:
              name: immich-configmap
        env:
          - name: POSTGRES_INITDB_ARGS
            value: '--data-checksums'
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
