apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: umami
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- db-credentials-sealedsecret.yaml
configurations:
- kustomizeconfig.yaml
configMapGenerator:
- name: umami-postgresql-config
  files:
  - pg_hba.conf=postgresql-hba.conf
