apiVersion: apps/v1
kind: Deployment
metadata:
  name: garajamus
  labels:
    app: garajamus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garajamus
  template:
    metadata:
      labels:
        app: garajamus
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: zion-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: registry.milanchis.com/garajamus:20260930-hub3@sha256:8cd2217cbeb5bd57a842d8da5c954624816642625729bb21e0bc29f551a64d68
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: GARAJAMUS_HUB_DB
              value: /data/hub.sqlite3
            - name: GARAJAMUS_HUB_KEYS_FILE
              value: /run/secrets/keys.json
            - name: GARAJAMUS_PUBLIC_URL
              value: https://garajamus.milanchis.com
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keys
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: garajamus-data
        - name: keys
          secret:
            secretName: zion-garajamus-keys
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
