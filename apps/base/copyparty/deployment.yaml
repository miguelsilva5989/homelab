apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  labels:
    app: copyparty
spec:
  replicas: 1
  # Persistent application state must have a single writer during upgrades.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: copyparty
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      containers:
      - name: copyparty
        image: copyparty/ac:1.20.26@sha256:b2054d65e05daa8982ca17c26b12b74315c0ce586a03ff9018a59c80731b9e19
        imagePullPolicy: Always
        ports:
          - containerPort: 3923
        env:
          # - name: PUID
          #   value: "1000"
        volumeMounts:
          - name: config-volume
            mountPath: /cfg
            readOnly: true
          - name: data-volume
            mountPath: /cfg/copyparty
          - name: share
            mountPath: /w
            subPath: .

      volumes:
        - name: config-volume
          configMap:
            name: copyparty-config-file
        - name: data-volume
          persistentVolumeClaim:
            claimName: copyparty-pvc
        - name: share
          persistentVolumeClaim:
            claimName: copyparty-share-pvc

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
