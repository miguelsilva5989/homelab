apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      # A Synced condition from an earlier generation is not sufficient.
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.conditions) &&
        status.conditions.exists(e, e.type == 'Synced' && e.status == 'True')
      failed: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.conditions) &&
        status.conditions.exists(e, e.type == 'Synced' && e.status == 'False')
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/overlays/zion
