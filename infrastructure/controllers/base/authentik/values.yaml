deployment:
  enabled: true
  kind: DaemonSet
  annotations: {}
  podAnnotations: {}
  additionalContainers: []
  initContainers: []
affinity: {}
authentik: {}
server:
  ingress:
    ingressClassName: traefik
    enabled: true
    hosts:
    - authentik.milanchis.com
  containerPorts:
    http: 9000
    https: 9443
  env:
  - name: AUTHENTIK_POSTGRESQL__HOST
    value: authentik-postgresql
  - name: AUTHENTIK_POSTGRESQL__USER
    value: authentik
  - name: AUTHENTIK_POSTGRESQL__NAME
    value: authentik
  - name: AUTHENTIK_POSTGRESQL__PASSWORD
    valueFrom:
      secretKeyRef:
        name: authentik-credentials
        key: password
  - name: PG_PASS
    valueFrom:
      secretKeyRef:
        name: authentik-credentials
        key: password
  - name: AUTHENTIK_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: authentik-credentials
        key: authentikSecret
  - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
    value: 127.0.0.1/32,::1/128,10.42.0.0/16
worker:
  enabled: true
  name: worker
  replicas: 3
  env:
  - name: AUTHENTIK_POSTGRESQL__HOST
    value: authentik-postgresql
  - name: AUTHENTIK_POSTGRESQL__USER
    value: authentik
  - name: AUTHENTIK_POSTGRESQL__NAME
    value: authentik
  - name: AUTHENTIK_POSTGRESQL__PASSWORD
    valueFrom:
      secretKeyRef:
        name: authentik-credentials
        key: password
  - name: PG_PASS
    valueFrom:
      secretKeyRef:
        name: authentik-credentials
        key: password
  - name: AUTHENTIK_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: authentik-credentials
        key: authentikSecret
  - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
    value: 127.0.0.1/32,::1/128,10.42.0.0/16
postgresql:
  enabled: true
  auth:
    existingSecret: authentik-credentials
  primary:
    extendedConfiguration: 'max_connections = 500

      '
    resourcesPreset: none
    persistence:
      enabled: true
      storageClass: longhorn
      accessModes:
      - ReadWriteOnce
      size: 1Gi
    extraVolumeMounts:
    - name: postgresql-socket
      mountPath: /var/run/postgresql
    extraVolumes:
    - name: postgresql-socket
      emptyDir: {}
    customReadinessProbe:
      exec:
        command:
        - /bin/sh
        - -c
        - exec pg_isready -U authentik -d dbname=authentik -h 127.0.0.1 -p 5432
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 6
  image:
    registry: docker.io
    repository: library/postgres
    tag: 17.11-bookworm
    digest: sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
global:
  image:
    tag: 2026.8.5
    digest: sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
