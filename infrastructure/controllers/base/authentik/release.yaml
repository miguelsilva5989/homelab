apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 50m
  chart:
    spec:
      chart: authentik
      version: 2025.10.3
      sourceRef:
        kind: HelmRepository
        name: goauthentik
        namespace: authentik
  valuesFrom:
  - kind: ConfigMap
    name: authentik-values
  timeout: 15m
  upgrade:
    cleanupOnFail: false
