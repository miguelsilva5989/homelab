apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.14.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  interval: 10m0s
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    serviceMonitor:
      interval: 15s
    grafana:
      persistence:
        enabled: true
        type: pvc
        existingClaim: kube-prometheus-stack-grafana-data
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: kube-prometheus-stack-grafana-admin
        userKey: admin-user
        passwordKey: admin-password
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
  upgrade:
    crds: CreateReplace
