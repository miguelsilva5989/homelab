apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: 1.12.1
  interval: 1m0s
  timeout: 15m0s
  values:
    defaultSettings:
      concurrentReplicaRebuildPerNodeLimit: 1
      snapshotHeavyTaskConcurrentLimit: 1
