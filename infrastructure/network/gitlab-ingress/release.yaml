apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-ingress
  namespace: gitlab-ingress
spec:
  interval: 50m
  install:
    createNamespace: true
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "42.1.3"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  valuesFrom:
    - kind: ConfigMap
      name: gitlab-ingress-values
